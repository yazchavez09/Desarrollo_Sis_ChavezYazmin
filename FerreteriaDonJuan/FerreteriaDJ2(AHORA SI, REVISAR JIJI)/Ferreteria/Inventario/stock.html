<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferreteria Don Juan</title>
    <link rel="stylesheet" href="../Estilos/stock.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <header>
        <div class="container">
            <div class="menu-icon" onclick="toggleMenu()">
                <img src="../imagenes/menu.png" alt="Menu Icon">
            </div>
            <h1>Ferreteria Don Juan</h1>
            <div class="logo" onclick="togglePersona()">
                <a href="InventarioEmpleado.html"><img src="../imagenes/logo.png" alt="Tools Icon"></a>
            </div>
        </div>
        <nav id="menu" class="menu">
            <ul class="pepe">
                <li class="elementoL"><a href="stock.html"><b>Stock</b></a></li>
                <li class="elementoL"><a href="carrito.html"><b>Carrito</b></a></li>
                <li class="elementoL"><a href="Reg.Ventas.html"><b>Registro ventas</b></a></li>
                <li class="elementoL"><a href="Reg.Cliente.html"><b>Registro clientes</b></a></li>
                <li class="elementoL"><a href="egresos.html"><b>Registro egresos</b></a></li>
                <li class="elementoL"><a href="proveedores.html"><b>Lista proveedores</b></a></li>
            </ul>
        </nav>
    </header>

    <script src="menu.js"></script>
    
    <p class="inventariotxt"><b>Stock</b></p>

    <!-- Formulario de búsqueda -->
    <form class="col-12" role="search">
        <input type="search" class="form-control form-control text-bg" placeholder="Buscar..." aria-label="Search">
    </form>

    <!-- Tabla de datos -->
    <div class="tabla-container">
        <table class="tabla-stock">
            <thead>
                <tr>
                    <th>ID_ART</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Compra</th>
                    <th>Precio Venta</th>
                </tr>
                <tr>
                    <td>123</td>
                    <td>Martillo</td>
                    <td>5</td>
                    <td>$7.000</td>
                    <td>$10.000</td>
                </tr>
            </thead>
            
        </table>
    </div>

    <!-- Botón para agregar producto -->
    <div class="boton-modal" style="justify-content: space-evenly;">
        <label for="btn-modal">Agregar Producto</label>

        <label for="btn-modal-editar">Editar Producto</label>
    </div>

    <!-- Ventana emergente -->
    <input type="checkbox" id="btn-modal">
    <div class="container-modal">
        <div class="ventanaAgg">
            <p class="texto_ventanaE"><b>Agregar Producto</b></p>
            <input class="registro" type="text" placeholder="Nombre producto">
            <input class="registro" type="text" placeholder="Cantidad">
            <input class="registro" type="text" placeholder="Valor mercado">
            <input class="registro1" type="text" placeholder="Valor venta">
            
            <div class="botones">
                <div class="btn-cerrar">
                    <label for="btn-modal">Cancelar</label>
                </div>
                <div class="siguiente">
                    <label for="siguiente" style="color: white;">Siguiente</label>
                </div>
            </div>
        </div>
    </div>

    <!-- -----------------------------Ventana emergente EDITAR---------------------------- -->

    <input type="checkbox" id="btn-modal-editar">
    <div class="container-modal-editar">
        <div class="ventanaAgg">
            <p class="texto_ventanaE"><b>Editar Producto</b></p>
            <input class="registro" type="text" placeholder="Nombre producto">
            <input class="registro" type="text" placeholder="Cantidad">
            <input class="registro" type="text" placeholder="Valor mercado">
            <input class="registro1" type="text" placeholder="Valor venta">
            
            <div class="botones">
                <div class="btn-cerrar">
                    <label for="btn-modal-editar">Cancelar</label>
                </div>
                <div class="siguiente">
                    <label for="siguiente" style="color: white;">Guardar cambios</label>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
