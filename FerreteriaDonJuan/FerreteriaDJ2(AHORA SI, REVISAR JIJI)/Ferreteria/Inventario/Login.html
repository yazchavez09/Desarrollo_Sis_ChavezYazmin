<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferreteria | Iniciar Sesion</title>
    <link rel="stylesheet" href="../Estilos/LR.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sanchez:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor">
        <p class="nombre">Ferreteria <br>Don Juan</p>
        <div class="separador"></div>
        <div class="inicio">
            <div class="formulario">
                <img src="../imagenes/logo.png" alt="Herramientas" class="logo-formulario">
                <h2>Iniciar sesión</h2>
                <form>
                    <div class="contenedor-input">
                        <img src="../imagenes/usuarioB.png" alt="Usuario" class="icono-input">
                        <input type="text" placeholder="Nombre de usuario" required>
                    </div>
                    <div class="contenedor-input">
                        <img src="../imagenes/candado.png" alt="Contraseña" class="icono-input">
                        <input type="password" placeholder="Contraseña" required>
                    </div>
                    <button type="submit">Entrar</button>
                </form>
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
                <div class="social">
                    <a href="#" class="icono-social"><img src="../imagenes/facebook.png" alt="Facebook"></a>
                    <a href="#" class="icono-social"><img src="../imagenes/google.png" alt="Google"></a>
                    <a href="#" class="icono-social"><img src="../imagenes/instagram.png" alt="Instagram"></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
