<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferreteria Don Juan</title>
    <link rel="stylesheet" href="../Estilos/estilosInventarios.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        /* Estilo básico para modal */
      
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="menu-icon" onclick="toggleMenu()">
                <img src="../imagenes/menu.png" alt="Menu Icon">
            </div>
            <h1>Ferreteria Don Juan</h1>
            <div class="logo" onclick="togglePersona()">
                <img src="../imagenes/logo.png" alt="Tools Icon">
            </div>
        </div>
        <nav id="menu" class="menu">
            <ul class="pepe">
                <li class="elementoL"><a href="stock.html"><b>Stock</b></a></li>
                <li class="elementoL"><a href="carrito.html"><b>Carrito</b></a></li>
                <li class="elementoL"><a href="Reg.Ventas.html"><b>Registro ventas</b></a></li>
                <li class="elementoL"><a href="Reg.Cliente.html"><b>Registro clientes</b></a></li>
                <li class="elementoL"><a href="egresos.html"><b>Registro egresos</b></a></li>
                <li class="elementoL"><a href="Reg.empleado.html"><b>Registro empleados</b></a></li>
                <li class="elementoL"><a href="proveedores.html"><b>Lista proveedores</b></a></li>
            </ul>
        </nav>
    </header>
    <script src="menu.js"></script>
    <p class="inventariotxt"><b>Inventario JEFE</b></p>

    <form class="col-12" role="search">
        <input type="search" class="form-control form-control text-bg" placeholder="Buscar..." aria-label="Search">
    </form>

    <div class="art">
        <!-- Artículo 1 -->
        <div class="articulo" style="border: 1px solid black;">
            <img class="martilloS" src="../imagenes/martillo1.jpg" alt="">
            <p><b>Martillo Stanley</b></p>
            <p class="precioMS">$7.000</p>
            <button class="compra" data-precio="7000">Comprar</button>
        </div>
        <!-- Artículo 2 -->
        <div class="articulo" style="border: 1px solid black;">
            <img class="pinza" src="../imagenes/pinza.jpeg" alt="">
            <p><b>Pinzas</b></p>
            <p class="precioMS">$8.200</p>
            <button class="compra" data-precio="8200">Comprar</button>
        </div>
        <!-- Artículo 3 -->
        <div class="articulo" style="border: 1px solid black;">
            <img class="clavos" src="../imagenes/clavos.png" alt="">
            <p><b>Clavos</b></p>
            <p class="precioMS">$50 c/u</p>
            <button class="compra" data-precio="50">Comprar</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="contenido">
            <h2>Carrito</h2>
            <div class="cantidad-container">
                <label for="cantidad">Cantidad:</label>
                <button id="restar" class="cantidad">-</button>
                <input type="text" id="cantidad" value="1" readonly>
                <button id="sumar" class="cantidad">+</button>
            </div>
            <p id="precio-total" style="margin-bottom: -10px;">Precio total: $0</p>
            <div class="botones">
                <button id="cancelar" class="btn-rojo">Cancelar</button>
                <button id="agregar" class="btn-verde">Agregar</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const modal = document.getElementById("modal");
        const botonesComprar = document.querySelectorAll(".compra");
        const cantidadInput = document.getElementById("cantidad");
        const precioTotal = document.getElementById("precio-total");
        const btnSumar = document.getElementById("sumar");
        const btnRestar = document.getElementById("restar");
        const btnCancelar = document.getElementById("cancelar");
        let precioUnitario = 0;

        botonesComprar.forEach(boton => {
            boton.addEventListener("click", (e) => {
                precioUnitario = parseInt(e.target.getAttribute("data-precio"));
                cantidadInput.value = 1;
                precioTotal.textContent = `Precio total: $${precioUnitario}`;
                modal.style.display = "flex";
            });
        });

        btnSumar.addEventListener("click", () => {
            let cantidad = parseInt(cantidadInput.value);
            cantidad++;
            cantidadInput.value = cantidad;
            precioTotal.textContent = `Precio total: $${cantidad * precioUnitario}`;
        });

        btnRestar.addEventListener("click", () => {
            let cantidad = parseInt(cantidadInput.value);
            if (cantidad > 1) {
                cantidad--;
                cantidadInput.value = cantidad;
                precioTotal.textContent = `Precio total: $${cantidad * precioUnitario}`;
            }
        });

        btnCancelar.addEventListener("click", () => {
            modal.style.display = "none";
        });
    </script>
</body>
</html>
